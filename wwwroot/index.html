<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VectorType // Cyberpunk Arcade Typing Game</title>
    <base href="/" />
    
    <!-- Google Fonts: Orbitron (Headings & HUD) & Share Tech Mono (Words & Stats) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-cyan': '#00f0ff',
                        'neon-pink': '#ff007f',
                        'neon-green': '#00ff66',
                        'neon-amber': '#ffb703',
                        'neon-purple': '#bd00ff',
                        'dark-space': '#070913',
                        'dark-card': '#0e1326',
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        mono: ['"Share Tech Mono"', 'monospace'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="VectorType.styles.css" rel="stylesheet" />
</head>

<body class="bg-[#05070f] text-slate-100 overflow-hidden select-none font-mono antialiased">
    <div id="app">
        <div class="flex flex-col items-center justify-center min-h-screen bg-[#05070f] text-neon-cyan font-orbitron">
            <div class="relative w-20 h-20 mb-6">
                <div class="absolute inset-0 rounded-full border-4 border-neon-cyan/20 animate-ping"></div>
                <div class="absolute inset-2 rounded-full border-4 border-t-neon-cyan border-r-neon-pink border-b-transparent border-l-transparent animate-spin"></div>
                <div class="absolute inset-5 rounded-full bg-neon-cyan/30 blur-sm"></div>
            </div>
            <h1 class="text-3xl font-black tracking-widest uppercase text-transparent bg-clip-text bg-gradient-to-r from-neon-cyan via-white to-neon-pink animate-pulse">
                VECTOR // TYPE
            </h1>
            <p class="text-xs text-slate-400 mt-2 font-mono tracking-widest">INITIALIZING QUANTUM CORE...</p>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Web Audio Synthesizer Script -->
    <script src="js/vector-audio.js"></script>
    <script>
        window.focusElement = function (el) {
            if (el && typeof el.focus === 'function') {
                el.focus();
            }
        };

        // Auto-refocus typing input on document click
        document.addEventListener('click', function () {
            const input = document.querySelector('input');
            if (input) {
                input.focus();
            }
        });
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
